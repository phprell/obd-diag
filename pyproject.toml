[project]
name = "obd-diag"
version = "0.0.1"
description = "OBD-II-Diagnose für Linux über ELM327-kompatible Adapter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Philipp Prell" }]
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
obd-diag = "obd_diag.cli:main"
obd-diag-gui = "obd_diag.ui.app:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial",
    "ELM327-emulator>=3.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "pyside6-essentials>=6.8",
    "pytest-qt>=4.5.0",
    "hypothesis>=6.168.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Der Katalog ist gitignored (wird gebaut, nicht eingecheckt), muss aber ins Paket.
artifacts = ["src/obd_diag/data/dtc_catalog.sqlite"]

[tool.hatch.build.targets.wheel]
packages = ["src/obd_diag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["elm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: braucht den ELM327-Emulator"]
# GUI-Tests (tests/ui) setzen QT_QPA_PLATFORM=offscreen selbst, siehe tests/ui/conftest.py
qt_api = "pyside6"

[tool.uv.sources]
# Das PyPI-sdist meldet beim Bauen 4.0.0.post1 statt 4.0.0, was uv ablehnt.
elm327-emulator = { git = "https://github.com/Ircama/ELM327-emulator", tag = "v4.0.0" }
