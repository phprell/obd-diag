[project]
name = "obd-diag"
version = "0.0.1"
description = "OBD-II-Diagnose für Linux über ELM327-kompatible Adapter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Philipp Prell" }]
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
obd-diag = "obd_diag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial",
    "ELM327-emulator>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_diag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["elm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: braucht den ELM327-Emulator"]
