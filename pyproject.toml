[project]
name = "obd-diag"
version = "0.2.0"
description = "OBD-II-Diagnose für Linux über ELM327-kompatible Adapter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Philipp Prell" }]
dependencies = [
    "pyserial>=3.5",
    "reportlab>=5.0.1",
]

[project.scripts]
obd-diag = "obd_diag.cli:main"
obd-diag-gui = "obd_diag.ui.app:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial",
    "ELM327-emulator>=3.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "pyside6-essentials>=6.8",
    "pytest-qt>=4.5.0",
    "pypdf>=6.19.0",
    "types-reportlab>=5.0.0.20261006",
    "hypothesis>=6.168.5",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "pyside6-essentials>=6.8",
    "pyyaml>=6.0.3",
    "sphinx>=9.1.0",
    "sphinx-argparse>=0.6.1",
    "sphinxcontrib-mermaid>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Der Katalog ist gitignored (wird gebaut, nicht eingecheckt), muss aber ins Paket.
artifacts = ["src/obd_diag/data/dtc_catalog.sqlite"]

[tool.hatch.build.targets.wheel]
packages = ["src/obd_diag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["elm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: braucht den ELM327-Emulator",
    "clear_disabled: Löschen bleibt wie ausgeliefert gesperrt (tests/conftest.py)",
    "request_gap: echte Mindestpause zwischen Anfragen (MIN_REQUEST_GAP); sonst in Tests 0 (tests/conftest.py)",
    "foreign_commands: spielt Mitschnitte anderer Programme nach; Befehle nicht gegen command_spec.yaml geprüft (tests/conftest.py)",
]
# GUI-Tests (tests/ui) setzen QT_QPA_PLATFORM=offscreen selbst, siehe tests/ui/conftest.py
qt_api = "pyside6"

[tool.mutmut]
# Mutationstests für Freigabeliste, Löschen, Ablage, Scan, Sitzung, Katalog und Mitschnitt; nur die
# schnellen Unit-Tests. Aufruf: uv run --with mutmut mutmut run (siehe README).
source_paths = ["src/obd_diag"]
only_mutate = [
    "src/obd_diag/protocol/elm327.py",
    "src/obd_diag/protocol/obd.py",
    "src/obd_diag/protocol/pids.py",
    "src/obd_diag/services/live.py",
    "src/obd_diag/services/clear.py",
    "src/obd_diag/services/storage.py",
    "src/obd_diag/services/diagnostics.py",
    "src/obd_diag/services/session.py",
    "src/obd_diag/data/dtc_catalog.py",
    "src/obd_diag/transport/trace.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
also_copy = ["tests"]

[tool.uv.sources]
# Das PyPI-sdist meldet beim Bauen 4.0.0.post1 statt 4.0.0, was uv ablehnt.
elm327-emulator = { git = "https://github.com/Ircama/ELM327-emulator", tag = "v4.0.0" }
