# Byte-genaue Mitschnitte echter Adapter an echten Fahrzeugen, wie Nutzer sie in
# Issue-Trackern quelloffener Projekte gepostet haben (abgerufen 2026-10). Übernommen sind
# nur kurze, faktische Protokoll-Zeichenketten als Zitat mit Quellenangabe; es wird kein
# Code der Projekte verwendet.
#
# python-OBD (https://github.com/brendan-w/python-OBD) loggt jeden Lesevorgang als
# Python-Bytes-Literal (``read: b'...'``) und betreibt den Adapter mit Headern (ATH1),
# Leerzeichen (ATS1) und ab ATE0 ohne Echo. Header-AN-Zeilen sind hier nach ATH0
# umgerechnet, aber nur wo das eindeutig ist (Feld ``headers_on`` zeigt das Original):
#   * J1850/ISO 9141/KWP (Protokolle 1–5): 3 Header-Bytes vorn und 1 Prüfsummen-Byte hinten
#     entfallen (Datenblatt ELM327DS S. 44: ``48 6B 10 41 00 BE 3E B8 11 FA`` mit ATH1
#     entspricht ``41 00 BE 3E B8 11`` mit ATH0).
#   * CAN 11 bit, Einzel-Frame: CAN-ID und PCI-Byte (Länge) entfallen, angezeigt werden
#     genau so viele Bytes wie das PCI-Byte angibt (ELM327DS S. 46, „Single Frame“).
# Die Umrechnung prüft tests/verification/test_traces.py gegen ``headers_on``.
#
# Ein python-OBD-Lesevorgang endet an ``>``; fehlt der Prompt im Log, hat python-OBD
# früher abgebrochen (es bricht auch bei ``OK`` ab). Solche Teilstücke sind hier nicht
# übernommen, nur vollständige Antworten.
#
# Felder wie in elm327_datasheet.yaml, zusätzlich source (URL) und adapter/vehicle.

# --- ATZ: Kennung mit Müll, Leerzeilen und Echo davor --------------------------------

- id: atz-fc-junk
  source: https://github.com/brendan-w/python-OBD/issues/187
  adapter: ELM327 v1.5 (Klon), ebenso in #153 und #164
  command: ATZ
  raw: "\xFC\r\rELM327 v1.5\r\r>"
  version: ELM327 v1.5

- id: atz-echo-fc-junk
  source: https://github.com/brendan-w/python-OBD/issues/153
  adapter: ELM327 v1.5 (Klon), Audi TT 1998 / Volvo V40 2003
  command: ATZ
  raw: "ATZ\r\xFC\r\rELM327 v1.5\r\r>"
  version: ELM327 v1.5

- id: atz-blank-lines
  source: https://github.com/brendan-w/python-OBD/issues/173
  command: ATZ
  raw: "\r\rELM327 v1.5\r\r>"
  version: ELM327 v1.5

- id: atz-echo-blank-lines
  source: https://github.com/brendan-w/python-OBD/issues/180
  command: ATZ
  raw: "ATZ\r\r\rELM327 v1.3a\r\r>"
  version: ELM327 v1.3a

- id: atz-single-cr
  source: https://github.com/brendan-w/python-OBD/issues/164
  command: ATZ
  raw: "ELM327 v2.1\r>"
  version: ELM327 v2.1

- id: ate0-echo
  source: https://github.com/brendan-w/python-OBD/issues/153
  note: Nach ATZ ist das Echo wieder an; die Antwort auf ATE0 selbst enthält noch das Echo.
  command: ATE0
  raw: "ATE0\rOK\r\r>"
  text: OK

- id: baud-probe-garbage
  source: https://github.com/brendan-w/python-OBD/issues/180
  note: Antwort beim Durchprobieren der Baudrate (python-OBD sendet dort ``\x7F\x7F``).
  command: ATI
  raw: "\x7F\x7F\r?\r\r>"
  error: UnknownCommandError

